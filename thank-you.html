<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Leafsong Retreat Sector MU Greater Noida</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="shortcut icon" href="assets/images/logo/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/pure.css">
    <style>
        .thankYouPage {
            min-height: 100vh;
            padding: 120px 20px 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #f8f4f0 0%, #ffffff 100%);
        }

        .thankYouCard {
            width: 100%;
            max-width: 640px;
            background: #fff;
            border-radius: 20px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(139, 94, 60, 0.12);
        }

        .thankYouIcon {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(139, 94, 60, 0.12);
            color: #8b5e3c;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .thankYouCard img {
            width: 130px;
            margin-bottom: 20px;
        }

        .thankYouCard h1 {
            font-family: "HistoryPro-Two", "Poppins", sans-serif;
            font-size: clamp(2rem, 4vw, 2.6rem);
            margin: 0 0 12px;
            color: #2f2a28;
        }

        .thankYouCard p {
            margin: 0 auto 28px;
            max-width: 480px;
            line-height: 1.7;
            color: #555;
            font-size: 1.05rem;
        }

        .thankYouActions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .thankYouActions a {
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .thankYouPrimary {
            background: var(--fontPrimary, #c8102e);
            color: #fff;
        }

        .thankYouSecondary {
            border: 1px solid rgba(0, 0, 0, 0.15);
            color: #333;
            background: #fff;
        }

        .thankYouNote {
            margin-top: 24px !important;
            font-size: 0.9rem !important;
            color: #777 !important;
        }

        @media (max-width: 560px) {
            .thankYouCard {
                padding: 36px 24px;
            }
        }
    </style>
</head>
<body>
    <header class="mainHeader">
        <div class="headerContainer">
            <div class="headerLogo">
                <a href="index.html">
                    <img src="assets/images/logo/logo.png" alt="Leafsong Retreat" width="85" height="40">
                </a>
            </div>
        </div>
    </header>

    <main class="thankYouPage">
        <div class="thankYouCard">
            <div class="thankYouIcon" aria-hidden="true">&#10003;</div>
            <img src="assets/images/logo/logo.png" alt="Leafsong Retreat">
            <h1>Thank You!</h1>
            <p>Your enquiry has been submitted successfully. Our team will contact you shortly with details about <strong>Leafsong Retreat</strong> in Sector MU, Greater Noida.</p>
            <div class="thankYouActions">
                <a class="thankYouPrimary" href="index.html">Back to Home</a>
                <a class="thankYouSecondary" href="tel:+918384072477">Call 8384072477</a>
                <a class="thankYouSecondary" href="https://wa.me/918384072477" target="_blank" rel="noopener">WhatsApp Us</a>
            </div>
            <p class="thankYouNote">For immediate assistance, call or WhatsApp us on 8384072477.</p>
        </div>
    </main>
</body>
</html>
